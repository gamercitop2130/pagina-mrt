<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Qué buscabas?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 24px; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #ffffff; color: #111111;
    }
    h1 { font-size: clamp(2rem, 8vw, 3.4rem); font-weight: 800; }
    .foto { width: min(86vw, 420px); border-radius: 12px; display: block; }
    .fallback { font-size: 8rem; display: none; }
  </style>
</head>
<body>
  <h1>¿Qué buscabas?</h1>

  <img class="foto" src="gato.jpg" alt="Gato blanco con cejas dibujadas mirando de reojo"
       onerror="this.style.display='none'; document.getElementById('fb').style.display='block';">
  <div class="fallback" id="fb">🐱</div>
</body>
</html>
