<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Express 2026</title>
    <style>
        :root { --primary: #28a745; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; overflow: hidden; }
        
        .header { background: var(--primary); color: white; margin: -30px -30px 25px -30px; padding: 20px; font-weight: bold; font-size: 1.2rem; }
        
        .slot-machine { background: #eee; border: 2px solid #ddd; height: 60px; border-radius: 8px; margin: 20px 0; overflow: hidden; position: relative; }
        .names-track { position: absolute; width: 100%; top: 0; transition: top 0.1s linear; }
        .name-item { height: 60px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; font-size: 1.1rem; }

        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 1rem; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        
        #win-section, #loader-section { display: none; }
        .win-msg { color: var(--primary); font-size: 1.4rem; font-weight: bold; margin: 15px 0; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="header">?? GRAN SORTEO SEMANAL ??</div>

    <div id="step-1">
        <h3>Premio: $10.000 ARS</h3>
        <p>Ingresá tus datos para participar del sorteo en vivo ahora mismo.</p>
        <input type="text" id="nombre" placeholder="Nombre y Apellido">
        <input type="number" id="dni" placeholder="DNI (solo números)">
        <button onclick="comenzarSorteo()">ANOTARSE Y SORTEAR</button>
    </div>

    <div id="step-2" style="display:none;">
        <p>Buscando ganador entre 2.450 participantes...</p>
        <div class="slot-machine">
            <div id="track" class="names-track">
                </div>
        </div>
    </div>

    <div id="win-section">
        <div class="win-msg">¡FELICITACIONES!</div>
        <p id="winner-text"></p>
        <hr>
        <p style="font-size: 0.8rem;">Completá el CBU para la transferencia inmediata:</p>
        <input type="text" id="cbu" placeholder="CBU / Alias">
        <button onclick="procesarPago()">RECLAMAR PREMIO</button>
    </div>

    <div id="loader-section">
        <div class="spinner"></div>
        <p id="status-text">Iniciando transferencia...</p>
    </div>
</div>

<script>
    const nombresFalsos = ["Marcos G.", "Lucía R.", "Bauti_99", "Matias Pérez", "Sol_Cardozo", "Julian22", "Carla M.", "Enzo_F", "Tobi_T", "Damián S."];
    let usuario = "";

    function comenzarSorteo() {
        usuario = document.getElementById('nombre').value;
        if(!usuario) return alert("Poné tu nombre");

        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';

        const track = document.getElementById('track');
        // Crear lista de nombres para la animación
        let html = "";
        for(let i=0; i<30; i++) {
            let n = nombresFalsos[Math.floor(Math.random()*nombresFalsos.length)];
            html += `<div class="name-item">${n}</div>`;
        }
        html += `<div class="name-item" style="color:#28a745">${usuario.toUpperCase()}</div>`;
        track.innerHTML = html;

        // Animar el "scroll"
        let pos = 0;
        let speed = 5;
        let interval = setInterval(() => {
            pos -= speed;
            track.style.top = pos + "px";
            if(pos < -1800) { // Cuando llega al final (donde está el usuario)
                clearInterval(interval);
                mostrarGanador();
            }
        }, 10);
    }

    function mostrarGanador() {
        setTimeout(() => {
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('win-section').style.display = 'block';
            document.getElementById('winner-text').innerHTML = `Has ganado el premio de <b>$10.000</b> por ser el usuario nro <b>#4.201</b> del día.`;
        }, 500);
    }

    function procesarPago() {
        const cbu = document.getElementById('cbu').value;
        if(!cbu) return alert("Ingresá un CBU o Alias");

        document.getElementById('win-section').style.display = 'none';
        document.getElementById('loader-section').style.display = 'block';

        const status = document.getElementById('status-text');
        setTimeout(() => status.innerText = "Conectando con Red Link...", 2000);
        setTimeout(() => status.innerText = "Error: Sesión de sorteo expirada.", 4500);
        
        setTimeout(() => {
            alert("SISTEMA: El tiempo para reclamar el premio ha expirado o el CBU no es válido para esta promoción bancaria.\n\nCódigo de error: ERR_PAYMENT_TIMEOUT_408");
            location.reload();
        }, 6500);
    }
</script>

</body>
</html>
